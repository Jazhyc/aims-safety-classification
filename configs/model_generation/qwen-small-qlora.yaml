defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

model:
  name: "Qwen/Qwen3-0.6B"
  max_length_causal: 512
  attn_implementation: "sdpa"

training:
  epochs: 1
  batch_size: 16
  learning_rate: 2e-4
  weight_decay: 0.01
  gradient_accumulation: 1
  bf16: true
  torch_compile: true
  gradient_checkpointing: true
  padding_free: false

data:
  test_size: 0.1
  val_size: 0.1
  seed: 22
  plot_lengths: false
  predict_harm: true

paths:
  output_dir: "train_results/causal/qwen-small-qlora"
  logs_dir: "logs_causal/causal/qwen-small-qlora"
  model_save_dir: "trained_models/causal/qwen-small-qlora"
  predictions_dir: "data/predictions/causal/qwen-small-qlora"

generation:
  max_new_tokens: 64
  num_beams: 1
  do_sample: false
  batch_size: 8

peft:
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
