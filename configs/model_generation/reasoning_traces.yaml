# Configuration for generating reasoning traces from WildGuard train set
# Uses vLLM pipeline with Qwen3-32B quantized model
# Reasoning is disabled via tokenizer (enable_thinking=False) - traces come from prompting

defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  max_length: 4096

conditions:
  - "without_intent"
  - "with_intent"
  - "zeroshot_cot"

dataset:
  dataset_name: "allenai/wildguardmix"
  subset: "wildguardtrain"
  split: "train"
  num_samples: 20
  seed: 42

generation:
  max_new_tokens: 4096
  temperature: 0.0
  top_p: 1.0
  top_k: -1

vllm:
  gpu_memory_utilization: 0.95
  max_model_len: 4096
  dtype: "bfloat16"
  enforce_eager: true

paths:
  output_dir: "data/reasoning_traces"

wandb:
  enabled: false
  entity: null
  project: "reasoning-traces-generation"
  tags: ["reasoning", "wildguard"]
  dir: "logs/wandb"
  mode: "online"