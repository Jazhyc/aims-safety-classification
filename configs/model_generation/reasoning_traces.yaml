# Configuration for generating reasoning traces from WildGuard train set
# Uses vLLM pipeline with a chat-capable model (e.g. Llama-3.1-8B-Instruct)
# Reasoning comes from prompting; enable_thinking=False is used when supported by the tokenizer

defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

model:
  name: "RedHatAI/gemma-3-27b-it-quantized.w4a16"
  max_length: 4096

# Conditions control which prompt template is used for each sample.
# Each condition produces one output per sample in the batch:
#   - without_intent:  Baseline from Traian's paper. Ground-truth harm label is provided
#                      in the prompt so the model explains *why* the label holds, but the
#                      label itself must not appear in the output.
#   - with_intent:     Same as without_intent but also includes the human-written intent
#                      from the annotated_intents dataset. Useful for studying whether
#                      explicit intent information improves reasoning quality.
#   - zeroshot_cot:    No ground-truth label or intent is supplied. The model must reason
#                      from scratch (zero-shot chain-of-thought). This mirrors the
#                      inference-time setting where labels are unknown.
# All enabled conditions are batched into a single vLLM call.
conditions:
  - "without_intent"
  - "with_intent"
  # - "zeroshot_cot"

# Dataset configuration
# Only the annotated_intents dataset is loaded. It contains prompts, human-written
# intents, harm labels (harm_column), and Wildguard IDs all in one place, so no
# secondary dataset join is needed.
# num_samples: null uses all available samples; set to an integer to subsample.
# Deduplication is done by Wildguard ID (one entry per unique prompt).
dataset:
  annotated_intents:
    dataset_name: "Jazhyc/wildguard-annotated-intents"
    subset: null
    split: "train"
    harm_column: "Annotator Harm"
  num_samples: null
  seed: 42

generation:
  max_new_tokens: 16384
  temperature: 0.0
  top_p: 1.0
  top_k: -1

# When true, the model's internal chain-of-thought is wrapped in <think>...</think>
# before the structured output.  Requires a model that supports thinking mode
# (e.g. Qwen3).  The <think> block is stripped by parse_model_output.
thinking_mode: false

vllm:
  gpu_memory_utilization: 0.95
  max_model_len: 20480
  max_num_seqs: 32
  dtype: "bfloat16"
  enforce_eager: false
  # Number of GPUs for tensor parallelism.
  # Set to null to auto-detect via torch.cuda.device_count(), but only do this
  # if all detected devices are distinct physical GPUs (check with nvidia-smi).
  # On this cluster, both CUDA device indices map to the same physical GPU
  # (MIG or virtualisation), so multi-GPU via NCCL fails with "duplicate GPU".
  tensor_parallel_size: 1

paths:
  output_dir: "data/reasoning_traces"

wandb:
  enabled: false
  entity: null
  project: "reasoning-traces-generation"
  run_name: null
  tags: ["reasoning", "wildguard"]
  dir: "logs/wandb"
  mode: "online"