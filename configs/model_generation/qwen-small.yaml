defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

model:
  name: "Qwen/Qwen3-0.6B"
  max_length_causal: 512
  attn_implementation: "flash_attention_2"

training:
  epochs: 1
  batch_size: 8
  learning_rate: 5e-5
  weight_decay: 0.01
  gradient_accumulation: 1 
  bf16: true
  torch_compile: true
  gradient_checkpointing: true
  padding_free: true

data:
  test_size: 0.1
  val_size: 0.1
  seed: 22
  plot_lengths: false

paths:
  output_dir: "train_results/causal/qwen-small"
  logs_dir: "logs_causal/causal/qwen-small"
  model_save_dir: "trained_models/causal/qwen-small"
  predictions_dir: "predictions/causal/qwen-small"

generation:
  max_new_tokens: 64  
  num_beams: 1
  do_sample: false
  batch_size: 4  # Batch size for generation
