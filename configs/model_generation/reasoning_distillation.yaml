defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

# Reasoning distillation: fine-tune a small causal LM on reasoning traces
# generated by a large teacher model (generate_reasoning_traces.py).
#
# The teacher produces structured outputs for each prompt:
#   Reasoning: <step-by-step analysis>
#   [Intent: <inferred intent>]     <- only in "with_intent" condition
#   Prompt harm: <harmful|safe>
#
# This config trains the student to reproduce that format.
# See causal.py: format_completion_with_reasoning / parse_reasoning_output.

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  max_length_causal: 4096   # prompt + reasoning output; increase if traces are long
  trust_remote_code: true
  attn_implementation: "sdpa"

training:
  epochs: 3
  batch_size: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  gradient_accumulation: 1
  fp16: false
  bf16: true
  optim: "paged_adamw_8bit"
  gradient_checkpointing: true

# ==============================================================
# DISTILLATION MODE — pick one condition and uncomment it below.
#
#  MODE D — Classification (reasoning + harm label only)
#    Output: Reasoning: <...>\nPrompt harm: <harmful|safe>
#    Use this when you want a classifier that explains its decision
#    but does not generate an intent.
#    Teacher traces: generated with condition "without_intent"
#
#  MODE E — Generation (reasoning + intent + harm label)
#    Output: Reasoning: <...>\nIntent: <...>\nPrompt harm: <harmful|safe>
#    Use this to train a model that also predicts the user's intent.
#    Teacher traces: generated with condition "with_intent"
#
# Set reasoning_traces_path to the parsed_results.json produced by
# scripts/generate_reasoning_traces.py for the relevant model/run.
# ==============================================================

data:
  seed: 22
  test_size: 0.1
  val_size: 0.1
  use_reasoning_traces: true

  reasoning_traces_path: "data/reasoning_traces/RedHatAI-gemma-3-27b-it-quantized.w4a16/parsed_results.json"

  # ---- MODE D: classification (reasoning + harm) ---------------
  reasoning_traces_condition: "without_intent"

  # ---- MODE E: generation (reasoning + intent + harm) ----------
  # reasoning_traces_condition: "with_intent"

# Keep paths in sync with the active condition above. The teacher model shorthand
# is included so runs distilled from different teachers don't overwrite each other.
# Pattern: reasoning-distillation-<teacher>-<condition>
#
#   MODE D (without_intent, gemma-3-27b teacher):
#     output_dir:      train_results/causal/reasoning-distillation-gemma-3-27b-without-intent
#     logs_dir:        logs/causal/reasoning-distillation-gemma-3-27b-without-intent
#     model_save_dir:  trained_models/causal/reasoning-distillation-gemma-3-27b-without-intent
#     predictions_dir: data/predictions/causal/reasoning-distillation-gemma-3-27b-without-intent
#
#   MODE E (with_intent, gemma-3-27b teacher):
#     output_dir:      train_results/causal/reasoning-distillation-gemma-3-27b-with-intent
#     logs_dir:        logs/causal/reasoning-distillation-gemma-3-27b-with-intent
#     model_save_dir:  trained_models/causal/reasoning-distillation-gemma-3-27b-with-intent
#     predictions_dir: data/predictions/causal/reasoning-distillation-gemma-3-27b-with-intent
paths:
  output_dir:      "train_results/causal/reasoning-distillation-gemma-3-27b-without-intent"
  logs_dir:        "logs/causal/reasoning-distillation-gemma-3-27b-without-intent"
  model_save_dir:  "trained_models/causal/reasoning-distillation-gemma-3-27b-without-intent"
  predictions_dir: "data/predictions/causal/reasoning-distillation-gemma-3-27b-without-intent"

generation:
  max_new_tokens: 2048
  num_beams: 1
  do_sample: false

peft:
  use_lora: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0
  bias: "none"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

wandb:
  project: "reasoning-distillation"
  name: null
