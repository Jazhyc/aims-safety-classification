# Configuration for safety classification experiment
# Supports 12 conditions:
#   - finetuned_generation: Fine-tuned model outputs (intent, harm)
#   - finetuned_classification: Fine-tuned model outputs harm only
#   - vanilla_classification: Vanilla model with system prompt -> harm only
#   - vanilla_generation: Vanilla model with system prompt -> intent + harm
#   - vanilla_with_human_intent: Vanilla model with prompt + human intent -> harm
#   - vanilla_with_model_intent: Vanilla model with prompt + model-generated intent -> harm
#   - llamaguard_classification: LlamaGuard baseline with same system prompt -> harm only
#   - zeroshot_cot_classification: CoT prompt -> reasoning + harm (JSON output)
#   - zeroshot_cot_generation: CoT prompt -> reasoning + intent + harm (JSON output)
#   - zeroshot_cot_classification_with_intent: CoT prompt + human intent -> reasoning + harm (JSON output)
#   - finetuned_reasoning_classification: Distilled model (MODE D) -> reasoning + harm
#   - finetuned_reasoning_generation: Distilled model (MODE E) -> reasoning + intent + harm

defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

# Experiment configuration
experiment:
  # Conditions to run. Uncomment the ones you want to evaluate.
  #
  # Baselines:
  #   - "vanilla_classification"
  #   - "vanilla_generation"
  #   - "vanilla_with_human_intent"
  #   - "llamaguard_classification"
  #
  # Fine-tuned (intent/harm, no reasoning):
  #   - "finetuned_generation"
  #   - "finetuned_classification"
  #
  # Zero-shot CoT (no fine-tuning, reasoning at inference time):
  #   - "zeroshot_cot_classification"
  #   - "zeroshot_cot_generation"
  #   - "zeroshot_cot_classification_with_intent"
  #
  # Reasoning distillation (fine-tuned on teacher traces):
  #   - "finetuned_reasoning_classification"  # MODE D: reasoning + harm
  #   - "finetuned_reasoning_generation"      # MODE E: reasoning + intent + harm
  conditions:
    - "finetuned_reasoning_classification"
    - "finetuned_reasoning_generation"

# Model configuration
model:
  # Base model for vanilla conditions
  name: "meta-llama/Llama-3.1-8B-Instruct"
  max_length: 4096

# Fine-tuned model configuration
# These are separate adapters trained for different tasks
finetuned:
  # Adapter for intent + harm generation (finetuned_generation condition)
  generation_adapter: "trained_models/causal/hyperparam_sweep/lr_5e-05_e_5_adapter"
  # Adapter for harm-only classification (finetuned_classification condition)
  classification_adapter: "trained_models/causal/classification-r16-a32_adapter"

  # Reasoning distillation adapters (trained via reasoning_distillation.yaml)
  # MODE D: distilled on without_intent traces -> prompt -> Reasoning + Prompt harm
  reasoning_classification_adapter: "trained_models/causal/reasoning-distillation-gemma-3-27b-without-intent_adapter"
  # MODE E: distilled on with_intent traces -> prompt -> Reasoning + Intent + Prompt harm
  reasoning_generation_adapter: "trained_models/causal/reasoning-distillation-gemma-3-27b-with-intent_adapter"

# LoRA configuration
lora:
  rank: 16

# LlamaGuard baseline configuration
llamaguard:
  name: "meta-llama/Llama-Guard-3-8B"

# Dataset configurations - cycles through all datasets
datasets:
  - name: "annotated-intents"
    dataset_name: "Jazhyc/wildguard-annotated-intents"
    subset: null
    split: "train"
    harm_column: "Annotator Harm"
    use_manual_split: true
    test_size: 0.1
    val_size: 0.1
    seed: 22
    output_dir: "data/safety_experiment/annotated_intents"

  - name: "wildguardmix"
    dataset_name: "allenai/wildguardmix"
    subset: "wildguardtest"
    split: "test"
    harm_column: "prompt_harm_label"
    use_manual_split: false
    seed: 22
    test_size: 0.1
    val_size: 0.1
    output_dir: "data/safety_experiment/wildguardmix"

  - name: "xstest"
    dataset_name: "walledai/XSTest"
    subset: null
    split: "test"
    harm_column: "label"
    use_manual_split: false
    seed: 22
    test_size: 0.1
    val_size: 0.1
    output_dir: "data/safety_experiment/xstest"

  # - name: "strongreject"
  #   dataset_name: "walledai/StrongREJECT"
  #   subset: null
  #   split: "train"
  #   harm_column: "harm_label"
  #   all_harmful: true
  #   use_manual_split: false
  #   seed: 22
  #   test_size: 0.1
  #   val_size: 0.1
  #   output_dir: "data/safety_experiment/strongreject"

# Generation parameters
generation:
  max_new_tokens: 2048
  temperature: 0.0  # Greedy decoding for consistency
  top_p: 1.0
  top_k: -1

# Paths
paths:
  output_dir: "data/safety_experiment"

# VLLM configuration
vllm:
  gpu_memory_utilization: 0.90
  max_model_len: 2048
  dtype: "bfloat16"
  enforce_eager: true

# Weights & Biases configuration
wandb:
  enabled: true
  entity: null
  project: "safety-experiment"
  run_name: null
  tags: ["safety", "classification"]
  dir: "logs/wandb"
  mode: "online"
