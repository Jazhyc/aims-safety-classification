defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

# Reasoning distillation: fine-tune a small causal LM on reasoning traces
# generated by a large teacher model (generate_reasoning_traces.py).
#
# The teacher produces structured outputs for each prompt:
#   Reasoning: <step-by-step analysis>
#   [Intent: <inferred intent>]     <- only in "with_intent" condition
#   Prompt harm: <harmful|safe>
#
# This config trains the student to reproduce that format.
# See causal.py: format_completion_with_reasoning / parse_reasoning_output.

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  max_length_causal: 4096   # prompt + reasoning output; increase if traces are long
  trust_remote_code: true
  attn_implementation: "flash_attention_2"

training:
  epochs: 5
  batch_size: 8
  learning_rate: 5e-5
  weight_decay: 0.00
  gradient_accumulation: 1
  fp16: false
  bf16: true
  optim: "paged_adamw_8bit"
  adam_beta1: 0.9
  adam_beta2: 0.98
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  gradient_checkpointing: false
  torch_compile: false
  padding_free: true
  skip_vllm_eval: false  # run post-training vLLM eval on validation set to get harm F1

data:
  use_reasoning_traces: true

  # Paths to parsed_results.json produced by generate_reasoning_traces.py.
  reasoning_traces_path: "data/reasoning_traces/RedHatAI-gemma-3-27b-it-quantized.w4a16/train/parsed_results.json"
  reasoning_traces_val_path: "data/reasoning_traces/RedHatAI-gemma-3-27b-it-quantized.w4a16/validation/parsed_results.json"

  # "without_intent": trains a classifier (Reasoning + Prompt harm)
  # "with_intent":    trains a generator  (Reasoning + Intent + Prompt harm)
  reasoning_traces_condition: "without_intent"

  # Drop examples where the teacher's predicted harm label or intent (with_intent only)
  # disagrees with the ground truth — keeps reasoning-to-label chains consistent.
  filter_teacher_disagreements: true

# Base directory for distillation model adapters. Override this to point to a
# different teacher's adapter directory without touching each path individually.
# Must match distillation_pipeline.yaml cache.distilled_models_dir when run via the pipeline.
distilled_models_dir: "models/distillation"

# Name paths after the teacher model and condition so runs don't overwrite each other.
# Pattern: reasoning-distillation-<teacher>-<condition>
paths:
  output_dir:      "data/train_results/distillation/reasoning-distillation-gemma-3-27b-without-intent"
  logs_dir:        "logs/distillation/reasoning-distillation-gemma-3-27b-without-intent"
  model_save_dir:  "${distilled_models_dir}/reasoning-distillation-gemma-3-27b-without-intent"
  predictions_dir: "data/predictions/reasoning-distillation-gemma-3-27b-without-intent"

generation:
  max_new_tokens: 2048
  num_beams: 1
  do_sample: false

peft:
  use_lora: true
  lora_rank: 32   # NOTE: causal.py reads "lora_rank", not "r"
  lora_alpha: 64
  lora_dropout: 0
  bias: "none"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

wandb:
  enabled: true
  project: "reasoning-distillation"
  run_name: null

artifacts:
  enabled: false
  registry_project: "intention-jailbreak-models"
  entity: null  # defaults to your wandb account
