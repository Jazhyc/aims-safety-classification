# Quick evaluation of openai/gpt-oss-safeguard-120b on all three test datasets.

defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

experiment:
  conditions:
    - "safeguard_classification"

model:
  name: "openai/gpt-oss-safeguard-120b"
  max_length: 4096

distilled_models_dir: "models/distillation"
sft_models_dir: "models/sft"

finetuned:
  generation_adapter: null
  classification_adapter: null
  reasoning_classification_adapter: null
  reasoning_generation_adapter: null

lora:
  rank: 16

llamaguard:
  name: "meta-llama/Llama-Guard-4-12B"

wildguard:
  name: "allenai/wildguard"

safeguard:
  name: "openai/gpt-oss-safeguard-120b"

datasets:
  - name: "annotated-intents"
    dataset_name: "Jazhyc/wildguard-annotated-intents"
    subset: null
    split: "test"
    harm_column: "Annotator Harm"
    use_manual_split: false
    output_dir: "data/safety_experiment/annotated_intents"

  - name: "wildguardmix"
    dataset_name: "allenai/wildguardmix"
    subset: "wildguardtest"
    split: "test"
    harm_column: "prompt_harm_label"
    use_manual_split: false
    output_dir: "data/safety_experiment/wildguardmix"

  - name: "xstest"
    dataset_name: "walledai/XSTest"
    subset: null
    split: "test"
    harm_column: "label"
    use_manual_split: false
    output_dir: "data/safety_experiment/xstest"

generation:
  max_new_tokens: 2048
  temperature: 0.0
  top_p: 1.0
  top_k: -1

paths:
  output_dir: "data/safety_experiment/safeguard"

vllm:
  gpu_memory_utilization: 0.95
  max_model_len: 4096
  dtype: "bfloat16"
  enforce_eager: false
  flash_attn_version: null

artifacts:
  enabled: false
  registry_project: "intention-jailbreak-models"
  entity: null
  results_name: null

wandb:
  enabled: true
  entity: null
  project: "Baselines"
  run_name: "gpt-oss-safeguard-120b"
  tags: ["safety", "classification", "safeguard"]
  dir: "logs/wandb"
  mode: "online"
