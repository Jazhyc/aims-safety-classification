defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"  # Will be overridden by command line
  max_length_causal: 512
  attn_implementation: "flash_attention_2"

training:
  epochs: 5
  batch_size: 32
  learning_rate: 2e-4
  weight_decay: 0.01
  gradient_accumulation: 1
  bf16: true
  torch_compile: false
  gradient_checkpointing: false
  padding_free: true
  optim: "paged_adamw_8bit"
  adam_beta1: 0.9
  adam_beta2: 0.999
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"

data:
  seed: 22
  # predict_harm: jointly generate intent text AND append a binary harm label.
  # Output format: "Intent: <text>; Harm: safe/harmful"
  # Set to false to generate plain intent text only.
  predict_harm: true
  # classification_only: skip intent generation entirely and only output the harm label ("safe" or "harmful").
  # Takes priority over predict_harm. Use for direct harm classification without intent reasoning.
  classification_only: false
  # use_reasoning_traces: train on teacher-generated chain-of-thought traces instead of raw annotations.
  # Requires pre-generated traces from scripts/distillation/generate_reasoning_traces.py.
  use_reasoning_traces: false

sft_models_dir: "models/sft"

paths:
  output_dir: "data/train_results/llm_sweep"
  logs_dir: "logs/llm_sweep"
  model_save_dir: "${sft_models_dir}/llm_sweep"
  predictions_dir: "data/predictions/llm_sweep"

generation:
  max_new_tokens: 64
  num_beams: 1
  do_sample: false
  batch_size: 8

peft:
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"

wandb:
  enabled: true
  project: "sft-hyperparam-sweep"
  name: "llm-generator"

artifacts:
  enabled: false
  registry_project: "intention-jailbreak-models"
  entity: null  # defaults to your wandb account
