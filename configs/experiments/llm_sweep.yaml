defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

model:
  name: "Qwen/Qwen3-0.6B"  # Will be overridden by command line
  max_length_causal: 512
  attn_implementation: "flash_attention_2"

training:
  epochs: 5
  batch_size: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  gradient_accumulation: 1
  bf16: true
  torch_compile: false
  gradient_checkpointing: true
  padding_free: true
  optim: "paged_adamw_8bit"
  adam_beta1: 0.9
  adam_beta2: 0.999
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"

data:
  test_size: 0.1
  val_size: 0.1
  seed: 22
  plot_lengths: false
  predict_harm: true

sft_models_dir: "models/sft"

paths:
  output_dir: "data/train_results/llm_sweep"
  logs_dir: "logs/llm_sweep"
  model_save_dir: "${sft_models_dir}/llm_sweep"
  predictions_dir: "data/predictions/llm_sweep"

generation:
  max_new_tokens: 64
  num_beams: 1
  do_sample: false
  batch_size: 8

peft:
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"

wandb:
  project: "intention-jailbreak-llm-sweep"
  name: "llm-generator"

artifacts:
  enabled: false
  registry_project: "intention-jailbreak-models"
  entity: null  # defaults to your wandb account
