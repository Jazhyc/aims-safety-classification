# Configuration for evaluating the best distillation adapters per
# (teacher × student × condition) combination.
#
# Conditions:
#   - finetuned_reasoning_classification:    no_intent traces (prompt -> Reasoning + Harm)
#   - finetuned_reasoning_synthetic_intent:  synthetic_intent traces (prompt -> Reasoning + Intent + Harm)
#   - finetuned_reasoning_human_intent:      human_intent traces (prompt -> Reasoning + Intent + Harm)
#
# model.name, finetuned.reasoning_*_adapter, paths.output_dir, and wandb.run_name
# are overridden per job by submit_distillation_eval.py.

defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

experiment:
  conditions:
    - "finetuned_reasoning_classification"
    - "finetuned_reasoning_generation"

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"  # overridden per job
  max_length: 4096

distilled_models_dir: "models/distillation"
sft_models_dir: "models/sft"

finetuned:
  use_merged: false
  generation_adapter: null
  classification_adapter: null
  # All three reasoning adapters are overridden to the selected adapter path per job.
  # Only one condition runs per SLURM job so only the relevant key is validated.
  reasoning_classification_adapter: "PLACEHOLDER"
  reasoning_human_intent_adapter: "PLACEHOLDER"
  reasoning_synthetic_adapter: "PLACEHOLDER"

lora:
  rank: 32

llamaguard:
  name: "meta-llama/Llama-Guard-4-12B"

wildguard:
  name: "allenai/wildguard"

safeguard:
  name: "openai/gpt-oss-safeguard-120b"

# Dataset output dirs use Hydra interpolation so overriding paths.output_dir
# automatically scopes all prediction files to the per-job directory.
datasets:
  - name: "annotated-intents"
    dataset_name: "Jazhyc/wildguard-annotated-intents"
    subset: null
    split: "test"
    harm_column: "Annotator Harm"
    use_manual_split: false
    output_dir: "${paths.output_dir}/annotated_intents"

  - name: "wildguardmix"
    dataset_name: "allenai/wildguardmix"
    subset: "wildguardtest"
    split: "test"
    harm_column: "prompt_harm_label"
    use_manual_split: false
    output_dir: "${paths.output_dir}/wildguardmix"

  - name: "xstest"
    dataset_name: "walledai/XSTest"
    subset: null
    split: "test"
    harm_column: "label"
    use_manual_split: false
    output_dir: "${paths.output_dir}/xstest"

  - name: "toxic-chat"
    dataset_name: "lmsys/toxic-chat"
    subset: "toxicchat0124"
    split: "test"
    harm_column: "toxicity"
    use_manual_split: false
    label_map:
      0: "safe"
      1: "harmful"
    output_dir: "${paths.output_dir}/toxic_chat"

  - name: "aegis"
    dataset_name: "nvidia/Aegis-AI-Content-Safety-Dataset-2.0"
    subset: null
    split: "test"
    harm_column: "prompt_label"
    use_manual_split: false
    output_dir: "${paths.output_dir}/aegis"

  - name: "openai-moderation"
    dataset_name: "AllanK24/openai-moderation-binary"
    subset: null
    split: "test"
    harm_column: "prompt_label"
    use_manual_split: false
    output_dir: "${paths.output_dir}/openai_moderation"

generation:
  max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  top_k: -1

paths:
  output_dir: "data/safety_experiment/distillation"  # overridden per job

vllm:
  gpu_memory_utilization: 0.90
  max_model_len: 4096
  dtype: "bfloat16"
  enforce_eager: false
  flash_attn_version: null

artifacts:
  enabled: true
  registry_project: "intention-jailbreak-models"
  entity: null
  results_name: "safety-experiment-distillation"

wandb:
  enabled: true
  entity: null
  project: "Distillation Results"
  run_name: null  # overridden per job
  tags: ["safety", "classification", "distillation"]
  dir: "logs/wandb"
  mode: "online"
