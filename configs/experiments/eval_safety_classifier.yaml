# Configuration for safety classification experiment
# Supports 13 conditions:
#
# Prompting baselines (no fine-tuning, single model instance):
#   - vanilla_classification: Vanilla model with system prompt -> harm only
#   - vanilla_generation: Vanilla model with system prompt -> intent + harm
#   - vanilla_with_human_intent: Vanilla model with prompt + human intent -> harm
#   - vanilla_with_model_intent: Vanilla model with prompt + model-generated intent -> harm
#   - zeroshot_cot_classification: CoT prompt -> reasoning + harm (JSON output)
#   - zeroshot_cot_generation: CoT prompt -> reasoning + intent + harm (JSON output)
#   - zeroshot_cot_classification_with_intent: CoT prompt + human intent -> reasoning + harm
#
# Prior-work baselines (separate model, loaded after main model is freed):
#   - llamaguard_classification: LlamaGuard 4 (12B) native safety classification
#   - wildguard_classification: WildGuard (7B) safety classification
#
# Fine-tuned (intent/harm, no reasoning):
#   - finetuned_generation: Fine-tuned model outputs (intent, harm)
#   - finetuned_classification: Fine-tuned model outputs harm only
#
# Reasoning distillation:
#   - finetuned_reasoning_classification: Distilled model (MODE D) -> reasoning + harm
#   - finetuned_reasoning_generation: Distilled model (MODE E) -> reasoning + intent + harm

defaults:
  - base_wandb@wandb
  - base_hydra@hydra
  - _self_

# Experiment configuration
experiment:
  # Conditions to run. Uncomment the ones you want to evaluate.
  #
  # Baselines:
  #   - "vanilla_classification"
  #   - "vanilla_generation"
  #   - "vanilla_with_human_intent"
  #   - "llamaguard_classification"
  #
  # Fine-tuned (intent/harm, no reasoning):
  #   - "finetuned_generation"
  #   - "finetuned_classification"
  #
  # Zero-shot CoT (no fine-tuning, reasoning at inference time):
  #   - "zeroshot_cot_classification"
  #   - "zeroshot_cot_generation"
  #   - "zeroshot_cot_classification_with_intent"
  #
  # Reasoning distillation (fine-tuned on teacher traces):
  #   - "finetuned_reasoning_classification"  # MODE D: reasoning + harm
  #   - "finetuned_reasoning_generation"      # MODE E: reasoning + intent + harm
  conditions:
    # Prompting baselines
    - "vanilla_classification"
    - "vanilla_generation"
    - "vanilla_with_human_intent"
    - "zeroshot_cot_classification"
    - "zeroshot_cot_generation"
    - "zeroshot_cot_classification_with_intent"
    # Prior-work baselines (separate model instances)
    - "llamaguard_classification"
    - "wildguard_classification"
    - "safeguard_classification"

# Model configuration
model:
  # Base model for vanilla conditions
  name: "meta-llama/Llama-3.1-8B-Instruct"
  max_length: 4096

# Base directory for distillation adapters. Change this one key to point evaluation
# at a different teacher's adapters. Must match distillation_pipeline.yaml cache.distilled_models_dir.
distilled_models_dir: "models/distillation"
sft_models_dir: "models/sft"

# Fine-tuned model configuration
# These are separate adapters trained for different tasks
finetuned:
  # Set to true when model.name points to a pre-merged model (via scripts/merge_adapter.py).
  # LoRA is disabled and adapter paths are ignored. The merged weights are baked into the model.
  use_merged: false

  # Adapter for intent + harm generation (finetuned_generation condition)
  generation_adapter: "${sft_models_dir}/hyperparam_sweep/lr_5e-05_e_5_adapter"
  # Adapter for harm-only classification (finetuned_classification condition)
  classification_adapter: "${sft_models_dir}/classification-r16-a32_adapter"

  # Reasoning distillation adapters (trained via reasoning_distillation.yaml / distillation_pipeline.yaml)
  # MODE D: distilled on without_intent traces -> prompt -> Reasoning + Prompt harm
  reasoning_classification_adapter: "${distilled_models_dir}/reasoning-distillation-gemma-3-27b-without-intent_adapter"
  # MODE E: distilled on with_intent traces -> prompt -> Reasoning + Intent + Prompt harm
  reasoning_generation_adapter: "${distilled_models_dir}/reasoning-distillation-gemma-3-27b-with-intent_adapter"

# LoRA configuration
lora:
  rank: 16

# LlamaGuard baseline configuration
llamaguard:
  name: "meta-llama/Llama-Guard-4-12B"

# WildGuard baseline configuration
wildguard:
  name: "allenai/wildguard"

# GPT-OSS-Safeguard baseline configuration
safeguard:
  name: "openai/gpt-oss-safeguard-120b"

# Dataset configurations - cycles through all datasets
datasets:
  - name: "annotated-intents"
    dataset_name: "Jazhyc/wildguard-annotated-intents"
    subset: null
    split: "test"
    harm_column: "Annotator Harm"
    use_manual_split: false
    output_dir: "data/safety_experiment/annotated_intents"

  - name: "wildguardmix"
    dataset_name: "allenai/wildguardmix"
    subset: "wildguardtest"
    split: "test"
    harm_column: "prompt_harm_label"
    use_manual_split: false
    output_dir: "data/safety_experiment/wildguardmix"

  - name: "xstest"
    dataset_name: "walledai/XSTest"
    subset: null
    split: "test"
    harm_column: "label"
    use_manual_split: false
    output_dir: "data/safety_experiment/xstest"

  - name: "toxic-chat"
    dataset_name: "lmsys/toxic-chat"
    subset: "toxicchat0124"
    split: "test"
    harm_column: "toxicity"
    use_manual_split: false
    label_map:
      0: "safe"
      1: "harmful"
    output_dir: "data/safety_experiment/toxic_chat"

  - name: "aegis"
    dataset_name: "nvidia/Aegis-AI-Content-Safety-Dataset-2.0"
    subset: null
    split: "test"
    harm_column: "prompt_label"
    use_manual_split: false
    output_dir: "data/safety_experiment/aegis"

  - name: "openai-moderation"
    dataset_name: "AllanK24/openai-moderation-binary"
    subset: null
    split: "test"
    harm_column: "prompt_label"
    use_manual_split: false
    output_dir: "data/safety_experiment/openai_moderation"

  # - name: "strongreject"
  #   dataset_name: "walledai/StrongREJECT"
  #   subset: null
  #   split: "train"
  #   harm_column: "harm_label"
  #   all_harmful: true
  #   use_manual_split: false
  #   seed: 22
  #   test_size: 0.1
  #   val_size: 0.1
  #   output_dir: "data/safety_experiment/strongreject"

# Generation parameters
generation:
  max_new_tokens: 2048
  temperature: 0.0  # Greedy decoding for consistency
  top_p: 1.0
  top_k: -1

# Paths
paths:
  output_dir: "data/safety_experiment"

# VLLM configuration
vllm:
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  dtype: "bfloat16"
  enforce_eager: false
  flash_attn_version: null  # FA4 only works on SM100 (B100/B200), not SM120 (RTX Pro 6000); null = auto-detect (FA2)

# Artifact registry
artifacts:
  enabled: true
  registry_project: "intention-jailbreak-models"
  entity: null  # defaults to your wandb account
  # Set results_name to upload all prediction JSONL files as a W&B artifact after the run.
  # Notebooks can then call download_results(results_name, ...) to pull them remotely.
  results_name: "safety-experiment-baselines"

# Weights & Biases configuration
wandb:
  enabled: true
  entity: null
  project: "Baselines"
  run_name: null
  tags: ["safety", "classification"]
  dir: "logs/wandb"
  mode: "online"
