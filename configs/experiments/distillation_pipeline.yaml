# Pipeline: teacher reasoning-trace generation → student distillation → safety evaluation.
#
# For each teacher model the pipeline runs three steps:
#   1. Teacher  – generate reasoning traces via generate_reasoning_traces.py
#   2. Distill  – fine-tune the student on those traces via train_generator.py
#   3. Evaluate – run safety_experiment.py with the distilled adapters
#
# Caching: each step writes a sentinel so it is skipped on re-runs:
#   Step 1: data/reasoning_traces/<teacher_slug>/train/parsed_results.json  (non-empty)
#   Step 2: models/<run_name>_adapter/adapter_config.json
#   Step 3: data/safety_experiment/pipeline/<teacher_slug>/.done
#
# WandB run names are "<teacher_slug>" for steps 1 & 3, and
# "<teacher_slug>-<condition>" for step 2.

defaults:
  - base_hydra@hydra
  - _self_

# ── Teacher models ─────────────────────────────────────────────────────────────
# Add one entry per teacher you want to benchmark.
teacher_models:
  # - "RedHatAI/gemma-3-27b-it-quantized.w4a16"
  # - "RedHatAI/Qwen3-32B-quantized.w4a16"
  # - "hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4"
  # - "openai/gpt-oss-120b"
  # - "z-ai/glm-5"              # via OpenRouter — add to teacher_backends below
   - "moonshotai/kimi-k2.5"    # via OpenRouter — add to teacher_backends below
  # - "cyankiwi/Qwen3.5-27B-AWQ-4bit"
  # - "Qwen/Qwen3.5-122B-A10B-GPTQ-Int4"
  # - "Qwen/Qwen3.5-27B"

# ── Per-teacher inference backend ──────────────────────────────────────────────
# Override the generation backend per teacher model.
# "vllm" (default) loads the model locally; "openrouter" calls the OpenRouter API
# (requires OPENROUTER_API_KEY).  Models not listed here default to "vllm".
teacher_backends: {
  "z-ai/glm-5": "openrouter",
  "moonshotai/kimi-k2.5": "openrouter"
} 

# ── Per-teacher trace overrides ────────────────────────────────────────────────
# Models listed here skip step 1 and use the provided train/parsed_results.json directly.
# The path should point to the train split file; val/test splits are not needed for distillation.
teacher_trace_overrides: {}

# ── Pipeline stages ─────────────────────────────────────────────────────────────
# Set any stage to false to skip it entirely (regardless of cache sentinels).
# Useful for debugging individual steps without running the full pipeline.
#   step1_teacher:  generate reasoning traces
#   step2_distill:  fine-tune student on traces
#   step3_safety:   run safety evaluation
stages:
  step1_teacher: true
  step2_distill: true
  step3_safety: true

# ── Thinking mode ───────────────────────────────────────────────────────────────
# When true, models that support it (e.g. Qwen3) emit <think>...</think> blocks
# before the structured output.  The pipeline passes this flag to step 1.
thinking_mode: true


# ── Conditions ─────────────────────────────────────────────────────────────────
# "without_intent" → student outputs Reasoning + Prompt harm
# "with_intent"    → student outputs Reasoning + Intent + Prompt harm
conditions:
  - "without_intent"
  - "with_intent"

# ── Run suffix ─────────────────────────────────────────────────────────────────
# Appended to adapter directory names and WandB run names to version experiments.
# Set to null (or omit) for no suffix.
run_suffix: "v5"

# ── Teacher generation ─────────────────────────────────────────────────────────
# num_samples: null uses the full dataset; set an integer to subsample.
num_samples: null

# ── CUDA device ────────────────────────────────────────────────────────────────
# Passed as CUDA_VISIBLE_DEVICES to every subprocess.
# Accepts an integer index, a MIG UUID, or null (inherit from environment).
cuda_visible_devices: null

# ── WandB ──────────────────────────────────────────────────────────────────────
# Separate project per step for easy side-by-side comparison in the W&B UI.
wandb:
  enabled: true
  entity: "intention-analysis"
  reasoning_traces_project: "reasoning-traces-generation-v4"
  distillation_project: "reasoning-distillation-v4"
  safety_project: "distillation-teacher-sweep-v4"

# ── Artifact registry ───────────────────────────────────────────────────────────
# When enabled, reasoning traces are uploaded to W&B after generation and
# downloaded automatically on the next run (or on a different machine) instead
# of re-running the expensive teacher model.
# Artifact name format: "reasoning-traces-<teacher_slug>"
# e.g. "reasoning-traces-Qwen-Qwen3.5-27B"
artifacts:
  enabled: false  # set to true to upload/download traces via W&B
  registry_project: "intention-jailbreak-models"
  entity: null  # defaults to wandb.entity above

# ── Cache directories (relative to project root) ───────────────────────────────
cache:
  reasoning_traces_dir: "data/reasoning_traces_v4"
  distilled_models_dir: "models/distillation"
  safety_dir: "data/safety_experiment"
