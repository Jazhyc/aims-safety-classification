# Minimal eval config for running openai-moderation dataset only.
# Used with submit_distillation_eval.py --eval-config eval_distillation_openai_mod
# --check-datasets openai_moderation to top up already-evaluated combinations.
#
# All non-dataset keys are inherited behaviour from the template shell script overrides;
# this config intentionally omits them so they still come in via CLI overrides.

defaults:
  - eval_distillation
  - _self_

datasets:
  - name: "openai-moderation"
    dataset_name: "AllanK24/openai-moderation-binary"
    subset: null
    split: "test"
    harm_column: "prompt_label"
    use_manual_split: false
    output_dir: "${paths.output_dir}/openai_moderation"
