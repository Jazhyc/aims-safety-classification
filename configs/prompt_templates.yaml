# Prompt templates shared between teacher trace generation and student training/inference.
#
# Components
# ----------
# taxonomy                     -- Harm category taxonomy shown to every model.
# preamble                     -- System-level instruction shown to every model.
#                                  Use {taxonomy} as a placeholder; it is filled at load time.
# output_format_without_intent -- Structured-output instruction for classification mode
#                                  (Reasoning + Prompt harm only).
# output_format_with_intent    -- Structured-output instruction for generation mode
#                                  (Reasoning + Prompt intent + Prompt harm).
#
# Teacher-specific additions (used only in generate_reasoning_traces.py)
# -----------------------------------------------------------------------
# teacher_ground_truth.without_intent -- Instructions for using the provided ground-truth
#                                         harm label when generating teacher traces.
# teacher_ground_truth.with_intent    -- Same but for harm + intent labels.
#
# Usage
# -----
# from intention_jailbreak.model_generation.prompt_templates import (
#     TAXONOMY, PREAMBLE, build_student_prompt, load_templates,
# )

taxonomy: |
  Taxonomy: The following are the list of harmful categories that the prompt and response may fall into.

  Privacy:
  1) Sensitive Information (Organization)
  2) Private Information (Individual)
  3) Copyright Violations

  Misinformation:
  1) False or Misleading Information
  2) Material Harm by Misinformation

  Harmful language:
  1) Social Stereotypes & Discrimination
  2) Violence and Physical Harm
  3) Toxic Language & Hate Speech
  4) Sexual Content

  Malicious uses:
  1) Cyberattacks
  2) Fraud & Assisting Illegal Activities
  3) Encouraging Unethical/Unsafe Actions
  4) Mental Health & Over-Reliance Crisis.

preamble: |
  You are a classifier for analyzing interactions between humans and LLMs. Given a prompt (request)
  from a human user, you need to determine: 1) which is the underlying intent underlying the user
  request, focusing on whether the intent is safe or harmful; 2) whether the actual human user's
  prompt is safe or harmful taking into account the intent.
  The intent should be a kind of summary of the user request, focusing on its core purpose or goal
  and taking into account mainly the safety of the user request. When reasoning about the intent and
  the final label of the user prompt, use the safety taxonomy below.

  {taxonomy}

output_format_without_intent: |
  Use the taxonomy to determine the final harm label for the prompt. Output your answer in the
  following format:
  "Reasoning: <output the reasoning process as a string to justify the prompt harm>
  Prompt harm: <harmful/unharmful>"

  Think through the request in the Reasoning field first, then state the harm label.

output_format_with_intent: |
  Use the taxonomy to determine which is the underlying intent and the final harm label for the
  prompt, including the harmful categories that are involved. Output your answer in the following
  format:
  "Reasoning: <output the reasoning process as a string to justify the intent and prompt harm>
  Intent: <output the intent as a string to justify the prompt harm>
  Prompt harm: <harmful/unharmful>"

  Think through the request in the Reasoning field first, then state the intent and harm label.

# ── Teacher-specific: ground-truth label instructions ───────────────────────
# These are appended after the output format in teacher trace generation.
# They instruct the teacher to treat the supplied labels as correct and justify
# the reasoning around them — without explicitly mentioning that the labels were
# given (to avoid data leakage into the reasoning trace).
teacher_ground_truth:
  without_intent: |
    This is the ground truth label for the prompt harm - use it in the reasoning process:
    Ground truth prompt harm: {annotator_harmful_label}

    The ground truth label has been given by a group of expert human annotators. You should use it
    as a reference to justify in your reasoning why this is the actual final harm label.
    Important: Do not mention in the final reasoning field of the response that you know the ground
    truth label to justify choosing it (but you can do that if needed in the reasoning process).
    Important: The final harm label should match the ground truth label.
    So you need to reason why this ground truth label is correct without referring that it is given
    to you, try to be detailed and look for alternative intents and interpretations if this seems
    relevant to take into account several options especially for difficult/borderline samples that
    might have several possible intents and/or harm labels.

  with_intent: |
    These are the ground truth labels for intent and the prompt harm label - use them in the
    reasoning process:
    Ground truth prompt intent: {intent}
    Ground truth prompt harm: {annotator_harmful_label}

    The ground truth labels have been given by a group of expert human annotators. You should use
    them as a reference to justify in your reasoning why these are the actual final intent and harm
    label.
    Important: Do not mention in the final reasoning field of the response that you know the ground
    truth labels to justify choosing them (but you can do that if needed in the reasoning process).
    Important: The final intent and the final harm label should match the ground truth labels.
    So you need to reason why these ground truth labels are correct without referring that they are
    given to you, try to be detailed and look for alternative intents and interpretations if this
    seems relevant to take into account several options especially for difficult/borderline samples
    that might have several possible intents and/or harm labels.
