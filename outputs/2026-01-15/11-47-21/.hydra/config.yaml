model:
  name: answerdotai/ModernBERT-base
  max_length_prompt: 256
  trust_remote_code: false
task:
  type: bert_harm
data:
  seed: 22
  test_size: 0.1
  val_size: 0.1
  harm_label_key: Annotator Harm
training:
  epochs: 5
  learning_rate: 2.0e-05
  batch_size: 16
  weight_decay: 0.01
  gradient_accumulation: 1
  bf16: true
  fp16: false
paths:
  output_dir: ./train_results/bert_harm/ModernBERT-base
  logs_dir: ./logs/bert_harm/ModernBERT-base
  model_save_dir: ./trained_models/bert_harm/ModernBERT-base
  predictions_dir: predictions_harm
wandb:
  project: bert-harm
  run_name: ModernBERT-base
  group: bert_harm
