[project]
name = "intention-jailbreak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3+cu128torch2.10-cp312-cp312-linux_x86_64.whl",
    "accelerate>=1.10.1",
    "bertopic>=0.17.3",
    "bitsandbytes>=0.48.1",
    "datasets>=4.1.1",
    "evaluate>=0.4.6",
    "fast-langdetect>=1.0.0",
    "hdbscan>=0.8.40",
    "hydra-core>=1.3.2",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.6",
    "nltk>=3.9.2",
    "peft>=0.18.0",
    "python-dotenv>=1.1.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.2",
    "torch>=2.10.0,<2.11",
    "tqdm>=4.67.1",
    "transformers>=5.5.0",
    "trl>=0.26.1",
    "umap-learn>=0.5.9.post2",
    "vllm==0.19.0",
    "wandb>=0.22.2",
]

[project.optional-dependencies]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intention_jailbreak"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
torch-backend = "auto"
